# .github/workflows/health-check.yml
# Runs portfolio health check every hour.
# Creates detailed GitHub issues showing exactly which page failed and why.

name: Hourly health check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Check all portfolio pages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run health check
        id: health
        run: |
          python app.py | tee health_report.txt

          # Extract failed pages for detailed alert
          if grep -q "UNHEALTHY" health_report.txt; then
            echo "status=unhealthy" >> $GITHUB_OUTPUT
            # Extract which specific pages failed
            FAILED=$(grep "❌" health_report.txt | sed 's/.*\[.*\]  //' | tr '\n' ', ' | sed 's/,$//')
            echo "failed_pages=$FAILED" >> $GITHUB_OUTPUT
            echo "::error::Pages DOWN: $FAILED"
          else
            echo "status=healthy" >> $GITHUB_OUTPUT
            echo "::notice::All portfolio pages are healthy ✅"
          fi

      - name: Print report
        run: cat health_report.txt

      - name: Create detailed alert issue
        if: steps.health.outputs.status == 'unhealthy'
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const report = fs.readFileSync('health_report.txt', 'utf8');
            const now    = new Date().toUTCString();
            const failed = '${{ steps.health.outputs.failed_pages }}';

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              labels: 'health-alert',
              state: 'open',
            });

            if (existing.data.length > 0) {
              // Add comment to existing issue with latest report
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: existing.data[0].number,
                body: `## 🔄 Still failing — ${now}\n\n**Failed pages:** ${failed}\n\n\`\`\`\n${report}\n\`\`\``,
              });
              console.log('Updated existing alert issue');
              return;
            }

            // Create new issue with specific failure details
            await github.rest.issues.create({
              owner:  context.repo.owner,
              repo:   context.repo.repo,
              title:  `🚨 Health check FAILED — ${failed} — ${now}`,
              body: `## Portfolio health check alert\n\n### ❌ Failed pages\n${failed.split(',').map(p => `- ${p.trim()}`).join('\n')}\n\n### Full report\n\`\`\`\n${report}\n\`\`\`\n\n### Debug steps\n1. Visit each failed URL manually\n2. Check GitHub Pages deployment status\n3. Check Cloudflare Worker logs\n\n---\n*Auto-generated by hourly health check · Close when resolved*`,
              labels: ['health-alert'],
            });

      - name: Close resolved alert issues
        if: steps.health.outputs.status == 'healthy'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              labels: 'health-alert',
              state: 'open',
            });
            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issue.number,
                body: '✅ All pages healthy again — auto-closing this alert.',
              });
              await github.rest.issues.update({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issue.number,
                state:        'closed',
              });
            }