# .github/workflows/health-check.yml
# Runs the portfolio health checker every hour using the Docker image.
# If any page is unhealthy, creates a GitHub issue as an alert.
# Works even when your local machine is off — runs entirely in the cloud.

name: Hourly health check

on:
  schedule:
    - cron: '0 * * * *'   # every hour at :00
  workflow_dispatch:        # run manually from Actions tab anytime

jobs:
  health-check:
    name: Check all portfolio pages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write          # needed to create alert issues

    steps:
      # Step 1: Checkout code to get app.py
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Run health check and save report
      - name: Run health check
        id: health
        run: |
          python app.py | tee health_report.txt
          if grep -q "UNHEALTHY" health_report.txt; then
            echo "status=unhealthy" >> $GITHUB_OUTPUT
          else
            echo "status=healthy" >> $GITHUB_OUTPUT
          fi

      # Step 4: Print report to Actions log (always visible)
      - name: Print report
        run: cat health_report.txt

      # Step 5: If unhealthy — create a GitHub issue as alert
      # Only triggers when a page is actually down
      - name: Create alert issue
        if: steps.health.outputs.status == 'unhealthy'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('health_report.txt', 'utf8');
            const now = new Date().toUTCString();

            // Check for existing open health alert issues to avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              labels: 'health-alert',
              state: 'open',
            });

            if (existing.data.length > 0) {
              console.log('Alert issue already open — skipping duplicate');
              return;
            }

            // Create a new alert issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 Portfolio health check FAILED — ${now}`,
              body: `## Portfolio health check alert\n\nOne or more pages returned a non-200 status.\n\n\`\`\`\n${report}\n\`\`\`\n\n---\n*Auto-generated by the hourly health check workflow.*\n*Close this issue once the problem is resolved.*`,
              labels: ['health-alert'],
            });

            console.log('Alert issue created!');

      # Step 6: If healthy and there are open alert issues — auto-close them
      - name: Close resolved alert issues
        if: steps.health.outputs.status == 'healthy'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              labels: 'health-alert',
              state: 'open',
            });

            for (const issue of existing.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                body: '✅ All pages healthy again — auto-closing this alert.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              console.log(`Closed issue #${issue.number}`);
            }
