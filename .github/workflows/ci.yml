# .github/workflows/ci.yml
# CI pipeline — runs on every push and pull request to main.
# Steps:
#   1. Run the full test suite with coverage
#   2. On failure: Gemini explains the error on the PR
#   3. On every PR: Gemini reviews all changed files
#   4. Enforce minimum 80% coverage threshold

name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    # Permissions needed to post PR comments
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # Step 1: Check out the repo code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Cache pip dependencies to speed up installs (saves 8–15s per run)
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Step 4: Install test dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      # Step 5: Run all tests using pytest discovery (no hardcoded file names)
      # Saves output to test_output.txt so Gemini can read it if tests fail
      - name: Run tests with coverage
        id: run_tests
        run: |
          pytest -v --tb=short --cov=app --cov-report=term-missing 2>&1 | tee test_output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      # Step 6: If tests failed on a PR, ask Gemini to explain the failure
      # Reads from test_output.txt file — avoids shell arg length limits
      - name: AI explains the failure
        if: steps.run_tests.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:      ${{ github.event.pull_request.number }}
        run: |
          python explain_failure.py test_output.txt

      # Step 7: On every PR, ask Gemini to review all changed files
      # Covers Python, YAML, HTML, JS — all file types in this repo
      - name: AI code review
        if: github.event_name == 'pull_request'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:      ${{ github.event.pull_request.number }}
        run: |
          python review_code.py

      # Step 8: Fail the pipeline if tests failed (after AI posted its comment)
      - name: Fail if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

      # Step 9: Enforce minimum 80% code coverage
      - name: Check coverage threshold
        run: |
          pytest --cov=app --cov-fail-under=80 -q