# .github/workflows/docker-build.yml
# Builds the portfolio health checker Docker image and pushes it to
# GitHub Container Registry (GHCR) on every push to main.
#
# Image available at: ghcr.io/ganeshputran/ai-devops-bot:latest
# Pull with:          docker pull ghcr.io/ganeshputran/ai-devops-bot:latest

name: Build and push Docker image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # needed to push to GitHub Container Registry

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Log in to GitHub Container Registry
      # Uses the automatic GITHUB_TOKEN — no extra secret needed
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Extract metadata for tags and labels
      # Automatically creates tags: latest, branch name, git sha
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      # Step 4: Set up Docker Buildx for efficient multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Build the image and push to GHCR
      # Uses layer caching to speed up subsequent builds
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha        # restore cache from GitHub Actions cache
          cache-to:   type=gha,mode=max  # save cache for next run

      # Step 6: Print the image digest for verification
      - name: Print image digest
        run: echo "Image pushed ${{ steps.meta.outputs.tags }}"
